<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>撮影進行ダッシュボード｜kaeka</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1f2430; --muted:#7b8394;
    --line:#e4e7ec; --accent:#4c6ef5; --accent-soft:#eef2ff;
    --planning:#f59e0b; --shootprep:#ef4444; --editing:#3b82f6; --done:#10b981; --late:#dc2626;
    --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;}
  .wrap{max-width:1600px;margin:0 auto;padding:22px 20px 60px;}
  header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:4px;}
  header.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em;}
  .today{color:var(--muted);font-size:13px;}
  .actions{margin-left:auto;display:flex;gap:8px;}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:12.5px;
    cursor:pointer;color:var(--ink);text-decoration:none;font-family:inherit;box-shadow:var(--shadow);}
  .btn:hover{background:var(--accent-soft);border-color:var(--accent);}
  .sub{color:var(--muted);font-size:12.5px;margin:4px 0 14px;}
  .sub a{color:var(--accent);text-decoration:none;} .sub a:hover{text-decoration:underline;}
  .summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:6px 13px;font-size:12.5px;box-shadow:var(--shadow);cursor:pointer;user-select:none;}
  .chip .dot{width:9px;height:9px;border-radius:50%;} .chip .n{font-weight:700;}
  .chip.active{border-color:var(--accent);background:var(--accent-soft);}
  .chip.warn{border-color:var(--late);color:var(--late);} .chip.warn.active{background:#fee2e2;}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);}
  .controls input[type=search]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);flex:1;min-width:160px;}
  .seg{display:flex;gap:4px;background:#f0f2f5;border-radius:8px;padding:3px;}
  .seg button{border:none;background:transparent;padding:6px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;color:var(--muted);font-family:inherit;}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow);font-weight:600;}
  .count{margin-left:auto;color:var(--muted);font-size:12.5px;}
  .board{display:flex;flex-direction:column;gap:10px;}
  .group-h{display:flex;align-items:center;gap:8px;margin:16px 2px 4px;font-size:14px;font-weight:700;color:var(--ink);}
  .group-h .dot{width:10px;height:10px;border-radius:50%;} .group-h .gn{color:var(--muted);font-weight:600;font-size:12px;}
  .group-h:first-child{margin-top:2px;}
  .card{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);
    border-left:5px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .12s ease;}
  .card:hover{box-shadow:0 6px 16px rgba(16,24,40,.10);}
  .c-left{flex:0 0 120px;padding:12px 11px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;}
  .status-badge{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap;}
  .delay-badge{align-self:flex-start;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;background:var(--late);white-space:nowrap;}
  .c-left .no{font-size:11px;color:var(--muted);font-weight:600;}
  .c-left .date{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .c-left .time{font-size:11px;color:var(--muted);}
  .c-main{flex:0 1 210px;padding:12px 13px;min-width:140px;}
  .c-main h3{margin:0 0 4px;font-size:14px;line-height:1.3;font-weight:700;}
  .c-main .meta{font-size:11px;color:var(--muted);line-height:1.4;}
  .c-main .meta b{color:var(--ink);font-weight:600;}
  .c-main .note{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.4;}
  .c-timeline{flex:1 1 720px;padding:24px 18px 16px;border-left:1px solid var(--line);display:flex;align-items:flex-start;}
  .step{flex:1 1 0;text-align:center;position:relative;padding-top:28px;min-width:0;}
  .step .mk{position:absolute;top:0;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;
    border:3px solid var(--line);background:#fff;z-index:2;}
  .step::before{content:"";position:absolute;top:7.5px;left:-50%;width:100%;height:3px;background:var(--line);z-index:1;}
  .step:first-child::before{display:none;}
  .step.done .mk{background:var(--done);border-color:var(--done);}
  .step.done::before{background:var(--done);}
  .step.current .mk{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft);}
  .step.overdue .mk{border-color:var(--late);background:#fff;box-shadow:0 0 0 4px #fee2e2;}
  .step .lbl{font-size:11px;color:var(--muted);line-height:1.25;padding:0 2px;}
  .step.done .lbl,.step.current .lbl{color:var(--ink);}
  .step.current .lbl{color:var(--accent);font-weight:700;}
  .step.overdue .lbl{color:var(--late);font-weight:700;}
  .step .dt{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px;}
  .step.overdue .dt{color:var(--late);}
  .c-cd{flex:0 0 132px;padding:12px 13px;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;text-align:right;}
  .countdown{font-weight:700;color:var(--ink);font-size:12.5px;} .countdown.late{color:var(--late);}
  .empty,.loading,.errbox{width:100%;text-align:center;color:var(--muted);padding:50px 0;}
  .errbox{color:#b42318;line-height:1.7;}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:8px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:900px){
    .card{flex-wrap:wrap;}
    .c-left{flex:1 1 100%;border-right:none;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;gap:10px;}
    .c-main{flex:1 1 100%;}
    .c-timeline{flex:1 1 100%;border-left:none;border-top:1px solid var(--line);}
    .c-cd{flex:1 1 100%;border-left:none;border-top:1px solid var(--line);justify-content:flex-start;text-align:left;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>撮影進行ダッシュボード</h1>
    <span class="today" id="today"></span>
    <div class="actions">
      <button class="btn" id="reload">↻ 最新に更新</button>
      <a class="btn" id="editlink" target="_blank">✎ スプレッドを編集</a>
    </div>
  </header>
  <div class="sub">「完了した工程」列で実績を管理し、予定日を過ぎても未完了の工程がある撮影を<b style="color:var(--late)">遅れ</b>として表示します。反映は「最新に更新」で。</div>
  <div class="summary" id="summary"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="🔍 企画・場所で検索…">
    <div class="seg" id="sortSeg">
      <button data-sort="status" class="on">ステータス順</button>
      <button data-sort="date">撮影日順</button>
    </div>
    <span class="count" id="count"></span>
  </div>
  <div class="board" id="grid"><div class="loading"><span class="spin"></span>スプレッドを読み込み中…</div></div>
</div>

<script>
const SHEET_ID = "1jQRfE8cYZOhEg2Firx90GPWn0An6kok_WLc7mMmpO-Y";
document.getElementById("editlink").href = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
const PHASES = {
  planning:{label:"企画中",color:"var(--planning)",raw:"#f59e0b"},
  shootprep:{label:"撮影準備中",color:"var(--shootprep)",raw:"#ef4444"},
  editing:{label:"編集中",color:"var(--editing)",raw:"#3b82f6"},
  done:{label:"完了",color:"var(--done)",raw:"#10b981"}
};
const PHASE_ORDER=["planning","shootprep","editing","done"];
const MILESTONES=[
  {key:"企画初稿",short:"企画初稿",bucket:"planning"},
  {key:"長門相談",short:"長門相談",bucket:"planning"},
  {key:"企画決定",short:"企画決定",bucket:"planning"},
  {key:"演者相談",short:"演者相談",bucket:"planning"},
  {key:"企画修正",short:"企画修正",bucket:"planning",alt:["企画調整"]},
  {key:"フロアプラン完了",short:"フロアプラン",bucket:"shootprep",alt:["コンテ完了"]},
  {key:"下見機材",short:"下見・機材",bucket:"shootprep"},
  {key:"撮影",short:"撮影",bucket:"shootprep",contains:"撮影"},
  {key:"データ送付",short:"データ送付",bucket:"editing"},
  {key:"デザイナー発注",short:"デザ発注",bucket:"editing"},
  {key:"編集発注",short:"編集発注",bucket:"editing"},
  {key:"納品",short:"納品",bucket:"editing"},
  {key:"アップロード",short:"アップロード",bucket:"done"}
];
const today=new Date();today.setHours(0,0,0,0);
document.getElementById("today").textContent="本日 "+today.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});

function addDays(b,n){const d=new Date(b);d.setDate(d.getDate()+n);return d;}
function parseAnyDate(s,ref){
  if(!s)return null; s=String(s).trim(); if(!s)return null;
  let m=s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if(m){const d=new Date(+m[1],+m[2]-1,+m[3]);d.setHours(0,0,0,0);return d;}
  m=s.match(/^(\d{1,2})[\/月](\d{1,2})/);
  if(m){const mon=+m[1]-1,day=+m[2];const base=ref||today;const y=base.getFullYear();
    const cands=[new Date(y-1,mon,day),new Date(y,mon,day),new Date(y+1,mon,day)];
    cands.forEach(d=>d.setHours(0,0,0,0));
    cands.sort((a,b)=>Math.abs(a-base)-Math.abs(b-base));
    return cands[0];}
  return null;
}
function fmt(d){return d?(d.getMonth()+1)+"/"+d.getDate()+"("+"日月火水木金土"[d.getDay()]+")":"—";}
function shortDate(d){return d?(d.getMonth()+1)+"/"+d.getDate():"—";}
function daysBetween(a,b){return Math.round((a-b)/86400000);}
function completedIndex(v){
  v=(v||"").trim(); if(!v||v==="なし"||v==="未着手"||v==="ー"||v==="-")return -1;
  for(let i=0;i<MILESTONES.length;i++){const m=MILESTONES[i];
    if(v===m.key||v===m.short)return i;
    if(m.alt&&m.alt.indexOf(v)>=0)return i;}
  for(let i=0;i<MILESTONES.length;i++){if(v.indexOf(MILESTONES[i].key)>=0||MILESTONES[i].key.indexOf(v)>=0)return i;}
  return -1;
}
function shootInfo(s){
  const ref=parseAnyDate(s.dates["撮影"]||"",null)||today;
  const md=MILESTONES.map(m=>parseAnyDate(s.dates[m.key]||"",ref));
  const done=completedIndex(s.completed);
  const phase = done<0 ? "planning" : MILESTONES[done].bucket;
  const overdue=[]; for(let i=done+1;i<MILESTONES.length;i++){ if(md[i]&&md[i]<today)overdue.push(i); }
  const firstOverdue = overdue.length? overdue[0] : -1;
  return {md,done,phase,overdue,firstOverdue,delayed:overdue.length>0,shootD:parseAnyDate(s.dates["撮影"]||"",ref)};
}
function timelineHTML(info){
  const ov=new Set(info.overdue);
  return MILESTONES.map((m,i)=>{
    let cls="future";
    if(i<=info.done)cls="done";
    else if(ov.has(i))cls="overdue";
    else if(i===info.done+1)cls="current";
    return `<div class="step ${cls}" title="${m.key}"><span class="mk"></span>
      <div class="lbl">${m.short}</div><div class="dt">${shortDate(info.md[i])}</div></div>`;
  }).join("");
}
function countdownText(info){
  if(info.delayed){const i=info.firstOverdue;const dd=daysBetween(today,info.md[i]);
    return {late:true, html:`⚠ ${MILESTONES[i].short}<br>${dd}日 遅れ`};}
  if(info.done>=MILESTONES.length-1)return {late:false, html:"完了（UP済み）"};
  const nextIdx=info.done+1; const m=MILESTONES[nextIdx]; const d=info.md[nextIdx];
  if(!d)return {late:false, html:`次は「${m.short}」<br>日付未入力`};
  const dd=daysBetween(d,today);
  if(dd===0)return {late:false, html:`本日：${m.short}`};
  return {late:false, html:`${m.short}まで<br>あと${dd}日`};
}
function cellVal(c){ if(!c)return""; if(c.f!=null)return String(c.f);
  let v=c.v; if(v==null)return"";
  if(typeof v==="string"){const m=v.match(/^Date\((\d+),(\d+),(\d+)/);if(m)return m[1]+"-"+(+m[2]+1)+"-"+m[3];}
  return String(v); }
function gridToShoots(grid){
  if(!grid.length)return[];
  let hIdx=grid.findIndex(r=>r.some(c=>c.includes("テーマ"))||r.some(c=>c.trim()==="No."));
  if(hIdx<0)hIdx=0;
  const head=grid[hIdx].map(c=>c.trim());
  const find=(pred)=>{for(let i=0;i<head.length;i++){if(pred(head[i]))return i;}return -1;};
  const col={
    no:find(h=>h==="No."||h==="No"||h==="no"),
    theme:find(h=>h.includes("テーマ")),
    perf:find(h=>h==="演者"),
    place:find(h=>h==="場所"),
    time:find(h=>h==="時間"),
    len:find(h=>h.includes("尺")),
    note:find(h=>h==="備考"),
    completed:find(h=>h==="完了した工程"||h==="完了工程"||h==="現在の工程"||h.indexOf("完了した")>=0)
  };
  const msCol=MILESTONES.map(m=>{
    let i=find(h=>h===m.key);
    if(i<0&&m.alt){for(const a of m.alt){i=find(h=>h===a);if(i>=0)break;}}
    if(i<0&&m.contains)i=find(h=>h.includes(m.contains));
    return i;
  });
  const g=(r,i)=>(i>=0&&r[i]!=null)?String(r[i]).trim():"";
  return grid.slice(hIdx+1).map(r=>{
    const dates={}; MILESTONES.forEach((m,k)=>{dates[m.key]=g(r,msCol[k]);});
    return {
      no:g(r,col.no),theme:g(r,col.theme),
      performers:g(r,col.perf).split("・").map(x=>x.trim()).filter(Boolean),
      place:g(r,col.place),time:g(r,col.time),len:g(r,col.len),note:g(r,col.note),
      completed:g(r,col.completed),dates
    };
  }).filter(s=>s.theme && s.theme!=="企画／テーマ");
}
let SHOOTS=[],activeFilter=null,sortMode="status";
function load(){
  const grid=document.getElementById("grid");
  grid.innerHTML=`<div class="loading"><span class="spin"></span>スプレッドを読み込み中…</div>`;
  const cb="gvizCb_"+Date.now();
  let done=false;
  const timer=setTimeout(()=>{ if(!done){done=true;cleanup();showErr("時間内に応答がありませんでした");} },12000);
  function cleanup(){ try{delete window[cb];}catch(e){window[cb]=undefined;} if(s&&s.parentNode)s.parentNode.removeChild(s); clearTimeout(timer); }
  function showErr(msg){ grid.innerHTML=`<div class="errbox">スプレッドを読み込めませんでした。<br>
    「↻ 最新に更新」で再試行するか、スプレッドが「リンクを知っている全員が閲覧可」かご確認ください。<br><small>${msg||""}</small></div>`; }
  window[cb]=function(resp){
    if(done)return; done=true; cleanup();
    try{
      const tbl=resp&&resp.table?resp.table:{};
      const labels=(tbl.cols||[]).map(c=>(c&&c.label!=null)?String(c.label):"");
      const dataG=(tbl.rows||[]).map(r=>(r.c||[]).map(cellVal));
      const g=[labels, ...dataG];
      const parsed=gridToShoots(g);
      if(!parsed.length)throw new Error("データが空です");
      SHOOTS=parsed; renderSummary(); render();
    }catch(e){ showErr((e&&e.message)||e); }
  };
  const s=document.createElement("script");
  s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&_=${Date.now()}`;
  s.onerror=()=>{ if(!done){done=true;cleanup();showErr("Failed to load (共有設定をご確認ください)");} };
  document.head.appendChild(s);
}
function renderSummary(){
  const c={planning:0,shootprep:0,editing:0,done:0}; let late=0;
  SHOOTS.forEach(s=>{const i=shootInfo(s);c[i.phase]++;if(i.delayed)late++;});
  const box=document.getElementById("summary");
  let html=`<div class="chip warn ${activeFilter==='delayed'?'active':''}" data-phase="delayed">⚠ 遅れ<span class="n">${late}</span></div>`;
  html+=PHASE_ORDER.map(k=>{const P=PHASES[k];
    return `<div class="chip ${activeFilter===k?"active":""}" data-phase="${k}">
      <span class="dot" style="background:${P.color}"></span>${P.label}<span class="n">${c[k]}</span></div>`;}).join("");
  box.innerHTML=html;
  box.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{const p=ch.dataset.phase;
    activeFilter=(activeFilter===p)?null:p;renderSummary();render();});
}
function cardHTML(r){const{s,info}=r;const P=PHASES[info.phase];
  const border=info.delayed?"var(--late)":P.raw; const cd=countdownText(info);
  return `<div class="card" style="border-left-color:${border}">
    <div class="c-left"><span class="status-badge" style="background:${P.color}">${P.label}</span>
      ${info.delayed?'<span class="delay-badge">遅れ</span>':''}
      <div class="no">No.${s.no}</div><div class="date">${fmt(info.shootD)}</div><div class="time">${s.time||""}</div></div>
    <div class="c-main"><h3>${s.theme}</h3>
      <div class="meta"><b>場所</b> ${s.place||"—"}${s.performers.length?` ／ <b>演者</b> ${s.performers.join("・")}`:""}${s.len?` ／ <b>尺</b> ${s.len}`:""}</div>
      ${s.note?`<div class="note">📌 ${s.note}</div>`:""}</div>
    <div class="c-timeline">${timelineHTML(info)}</div>
    <div class="c-cd"><div class="countdown ${cd.late?'late':''}">${cd.html}</div></div></div>`;
}
function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const grid=document.getElementById("grid");
  let rows=SHOOTS.map(s=>({s,info:shootInfo(s)}));
  let view=rows.filter(r=>{
    if(activeFilter==="delayed"){ if(!r.info.delayed)return false; }
    else if(activeFilter&&r.info.phase!==activeFilter)return false;
    if(q){const hay=(r.s.theme+" "+r.s.place+" "+r.s.note+" "+r.s.performers.join(" ")).toLowerCase();if(!hay.includes(q))return false;}
    return true;});
  document.getElementById("count").textContent=view.length+" 件表示";
  if(!view.length){grid.innerHTML=`<div class="empty">条件に合う撮影がありません。</div>`;return;}
  if(sortMode==="date"){
    view.sort((a,b)=>(a.info.shootD||0)-(b.info.shootD||0));
    grid.innerHTML=view.map(cardHTML).join("");
  }else{
    view.sort((a,b)=>{const ra=PHASE_ORDER.indexOf(a.info.phase),rb=PHASE_ORDER.indexOf(b.info.phase);
      if(ra!==rb)return ra-rb;
      if(a.info.phase==="editing"){const na=parseInt(a.s.no,10),nb=parseInt(b.s.no,10);const va=isNaN(na)?99999:na,vb=isNaN(nb)?99999:nb;if(va!==vb)return va-vb;}
      return (a.info.shootD||0)-(b.info.shootD||0);});
    let html="",last=null;
    view.forEach(r=>{if(r.info.phase!==last){const P=PHASES[r.info.phase];const cnt=view.filter(x=>x.info.phase===r.info.phase).length;
      html+=`<div class="group-h"><span class="dot" style="background:${P.color}"></span>${P.label}<span class="gn">${cnt}件</span></div>`;last=r.info.phase;}
      html+=cardHTML(r);});
    grid.innerHTML=html;
  }
}
document.getElementById("q").oninput=render;
document.getElementById("reload").onclick=()=>load();
document.querySelectorAll("#sortSeg button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#sortSeg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");sortMode=b.dataset.sort;render();});
load();
</script>
</body>
</html>
