<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>撮影進行ダッシュボード｜kaeka</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f4f5f7; --card:#ffffff; --ink:#1f2430; --muted:#7b8394;
    --line:#e4e7ec; --accent:#4c6ef5; --accent-soft:#eef2ff;
    --planning:#f59e0b; --shootprep:#ef4444; --editing:#3b82f6; --done:#10b981; --late:#dc2626;
    --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;}
  .wrap{max-width:1600px;margin:0 auto;padding:22px 20px 60px;}
  header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:4px;}
  header.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em;}
  .today{color:var(--muted);font-size:13px;}
  .hbtns{display:flex;gap:8px;margin-left:auto;align-items:center;}
  .hbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:12.5px;
    cursor:pointer;font-family:inherit;color:var(--ink);text-decoration:none;display:inline-block;box-shadow:var(--shadow);}
  .hbtn:hover{background:var(--accent-soft);border-color:var(--accent);}
  .sub{color:var(--muted);font-size:12.5px;margin:4px 0 14px;}
  .sub a{color:var(--accent);text-decoration:none;} .sub a:hover{text-decoration:underline;}
  .summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:6px 13px;font-size:12.5px;box-shadow:var(--shadow);cursor:pointer;user-select:none;}
  .chip .dot{width:9px;height:9px;border-radius:50%;} .chip .n{font-weight:700;}
  .chip.active{border-color:var(--accent);background:var(--accent-soft);}
  .chip.warn{border-color:var(--late);color:var(--late);} .chip.warn.active{background:#fee2e2;}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);}
  .controls input[type=search]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);flex:1;min-width:160px;}
  .seg{display:flex;gap:4px;background:#f0f2f5;border-radius:8px;padding:3px;}
  .seg button{border:none;background:transparent;padding:6px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;color:var(--muted);font-family:inherit;}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow);font-weight:600;}
  .count{margin-left:auto;color:var(--muted);font-size:12.5px;}
  .board{display:flex;flex-direction:column;gap:10px;}
  .group-h{display:flex;align-items:center;gap:8px;margin:14px 2px 2px;font-size:13px;font-weight:700;color:var(--ink);}
  .group-h .dot{width:10px;height:10px;border-radius:50%;} .group-h .gn{color:var(--muted);font-weight:600;font-size:12px;}
  .group-h:first-child{margin-top:2px;}
  .card{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);
    border-left:5px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .12s ease;}
  .card:hover{box-shadow:0 6px 16px rgba(16,24,40,.10);}
  .c-left{flex:0 0 120px;padding:12px 11px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;}
  .status-badge{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap;}
  .delay-badge{align-self:flex-start;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;background:var(--late);white-space:nowrap;}
  .c-left .no{font-size:11px;color:var(--muted);font-weight:600;}
  .c-left .date{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .c-left .time{font-size:11px;color:var(--muted);}
  .c-main{flex:0 1 210px;padding:12px 13px;min-width:140px;}
  .c-main h3{margin:0 0 4px;font-size:14px;line-height:1.3;font-weight:700;}
  .c-main .meta{font-size:11px;color:var(--muted);line-height:1.4;}
  .c-main .meta b{color:var(--ink);font-weight:600;}
  .c-main .note{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.4;}
  .c-timeline{flex:1 1 720px;padding:24px 18px 16px;border-left:1px solid var(--line);display:flex;align-items:flex-start;}
  .step{flex:1 1 0;text-align:center;position:relative;padding-top:28px;min-width:0;}
  .step .mk{position:absolute;top:0;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;
    border:3px solid var(--line);background:#fff;z-index:2;}
  .step::before{content:"";position:absolute;top:7.5px;left:-50%;width:100%;height:3px;background:var(--line);z-index:1;}
  .step:first-child::before{display:none;}
  .step.done .mk{background:var(--done);border-color:var(--done);}
  .step.done::before{background:var(--done);}
  .step.current .mk{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft);}
  .step.overdue .mk{border-color:var(--late);background:#fff;box-shadow:0 0 0 4px #fee2e2;}
  .step .lbl{font-size:11px;color:var(--muted);line-height:1.25;padding:0 2px;}
  .step.done .lbl,.step.current .lbl{color:var(--ink);}
  .step.current .lbl{color:var(--accent);font-weight:700;}
  .step.overdue .lbl{color:var(--late);font-weight:700;}
  .step .dt{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px;}
  .step.overdue .dt{color:var(--late);}
  .c-cd{flex:0 0 132px;padding:12px 13px;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;text-align:right;}
  .countdown{font-weight:700;color:var(--ink);font-size:12.5px;}
  .countdown.late{color:var(--late);}
  .empty,.loading,.errbox{width:100%;text-align:center;color:var(--muted);padding:50px 0;}
  .errbox{color:#b42318;}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:8px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:900px){
    .card{flex-wrap:wrap;}
    .c-left{flex:1 1 100%;border-right:none;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;gap:10px;}
    .c-main{flex:1 1 100%;}
    .c-timeline{flex:1 1 100%;border-left:none;border-top:1px solid var(--line);}
    .c-cd{flex:1 1 100%;border-left:none;border-top:1px solid var(--line);justify-content:flex-start;text-align:left;}
  }
  /* ===== ビュー切替タブ ===== */
  .viewtabs{display:inline-flex;gap:4px;background:#e8eaee;border-radius:10px;padding:4px;margin:2px 0 12px;}
  .viewtabs button{border:none;background:transparent;padding:8px 18px;border-radius:7px;font-size:13.5px;
    font-family:inherit;cursor:pointer;color:var(--muted);font-weight:600;}
  .viewtabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow);}
  /* ===== 公開カレンダー ===== */
  .calbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);}
  .calbar .navbtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;
    cursor:pointer;font-size:15px;color:var(--ink);font-family:inherit;line-height:1;}
  .calbar .navbtn:hover{background:var(--accent-soft);border-color:var(--accent);}
  .calbar .ym{font-size:16px;font-weight:700;min-width:118px;text-align:center;font-variant-numeric:tabular-nums;}
  .calbar .tdbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;
    cursor:pointer;font-family:inherit;color:var(--ink);}
  .calbar .tdbtn:hover{background:var(--accent-soft);border-color:var(--accent);}
  .calbar .legend{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap;}
  .calbar .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .cal .dow{background:#f7f8fa;text-align:center;font-size:11.5px;padding:7px 0;color:var(--muted);font-weight:700;}
  .cal .dow.sun{color:#dc2626;} .cal .dow.sat{color:#2563eb;}
  .cal .cell{background:#fff;min-height:96px;padding:5px 6px 7px;}
  .cal .cell.out{background:#fafbfc;}
  .cal .cell.today{background:#fffbeb;box-shadow:inset 0 0 0 2px #f59e0b;}
  .cal .dnum{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;}
  .cal .cell.sun .dnum{color:#dc2626;} .cal .cell.sat .dnum{color:#2563eb;}
  .cal .cell.out .dnum,.cal .cell.out.sun .dnum,.cal .cell.out.sat .dnum{color:#c9ced8;}
  .pill{display:block;margin-top:3px;font-size:10.5px;line-height:1.35;padding:2px 5px;border-radius:5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pill.main{background:#eef2ff;color:#3730a3;border-left:3px solid #4c6ef5;}
  .pill.short{background:#ecfdf5;color:#065f46;border-left:3px solid #10b981;}
  .pill.pub{opacity:.5;}
  .callist{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;box-shadow:var(--shadow);}
  .callist h4{margin:0 0 8px;font-size:13px;font-weight:700;}
  .callist table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .callist th,.callist td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);}
  .callist th{color:var(--muted);font-weight:600;font-size:11.5px;}
  .callist tr:last-child td{border-bottom:none;}
  .callist .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;}
  .callist .tag.main{background:#eef2ff;color:#3730a3;} .callist .tag.short{background:#ecfdf5;color:#065f46;}
  .callist .st{font-size:11px;color:var(--muted);white-space:nowrap;}
  .callist .st.pub{color:var(--done);font-weight:700;}
  .callist .none{color:var(--muted);font-size:12.5px;padding:6px 2px;}
  .callist .dt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600;}
  .foot{margin:20px 2px 6px;color:var(--muted);font-size:11.5px;line-height:1.6;}
  .step.clickable{cursor:pointer;}
  .step.clickable .mk{transition:transform .1s ease,box-shadow .1s ease;}
  .step.clickable:hover .mk{transform:translateX(-50%) scale(1.3);box-shadow:0 0 0 4px var(--accent-soft);}
  .step.saving .mk{opacity:.4;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;
    background:#1f2430;color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;max-width:90vw;
    box-shadow:0 6px 20px rgba(16,24,40,.28);opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .toast.show{opacity:1;}
  .toast.err{background:#b42318;}
  @media(max-width:720px){
    .cal .cell{min-height:74px;padding:4px;}
    .pill{font-size:9.5px;}
    .calbar .legend{margin-left:0;width:100%;}
    .hbtns{margin-left:0;width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>撮影進行ダッシュボード</h1>
    <span class="today" id="today"></span>
    <div class="hbtns">
      <button class="hbtn" id="reload">↻ 最新に更新</button>
      <a class="hbtn" id="sheetLink" target="_blank" rel="noopener">✎ スプレッドを編集</a>
    </div>
  </header>
  <div class="sub">「完了した工程」列で実績を管理し、予定日を過ぎても未完了の工程がある撮影を<b style="color:var(--late)">遅れ</b>として表示します。反映は「最新に更新」で。</div>

  <div class="viewtabs" id="viewTabs">
    <button data-view="board" class="on">進行カード</button>
    <button data-view="cal">公開カレンダー</button>
  </div>

  <!-- ===== 進行カードビュー ===== -->
  <div id="viewBoard">
    <div class="summary" id="summary"></div>
    <div class="controls">
      <input type="search" id="q" placeholder="🔍 企画・場所で検索…">
      <div class="seg" id="sortSeg">
        <button data-sort="status" class="on">ステータス順</button>
        <button data-sort="date">撮影日順</button>
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="board" id="grid"><div class="loading"><span class="spin"></span>スプレッドを読み込み中…</div></div>
  </div>

  <!-- ===== 公開カレンダービュー ===== -->
  <div id="viewCal" hidden>
    <div class="calbar">
      <button class="navbtn" id="calPrev" title="前の月">&lsaquo;</button>
      <div class="ym" id="calYM">—</div>
      <button class="navbtn" id="calNext" title="次の月">&rsaquo;</button>
      <button class="tdbtn" id="calToday">今月</button>
      <div class="legend">
        <span><i style="background:#4c6ef5"></i>本編アップロード</span>
        <span><i style="background:#10b981"></i>ショートUP</span>
        <span style="opacity:.55">薄い表示＝公開済み</span>
      </div>
    </div>
    <div class="cal" id="calGrid"></div>
    <div class="callist" id="calList"></div>
  </div>

  <div class="foot">工程の丸をクリックすると、その工程まで完了としてスプレッドに書き戻します。スプレッド側の変更は60秒ごとに自動で取り込みます。<br>ページ版 2026-09-26（工程14：企画初稿→企画決定→撮影日→…→ショートUP）／「↻ 最新に更新」はページごと再読み込みします</div>
</div>

<script>
var SHEET_ID = "1jQRfE8cYZOhEg2Firx90GPWn0An6kok_WLc7mMmpO-Y";
var SHEET_GID = "1866005728"; /* 撮影進行の1枚目タブ */
var SHEET_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/edit";
var CSV_BASE  = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq";
/* 工程の丸をクリックしたときにスプレッドへ書き戻すApps Scriptの窓口 */
var API_URL = "https://script.google.com/macros/s/AKfycbzuMe2Mbf3ENUCWKWztjk7EXcE6RcgXUBHYzCjbRdl9N5EqPfWezUedr3V3SNNeELTmwg/exec";
var AUTO_REFRESH_MS = 60000;
document.getElementById("sheetLink").href = SHEET_URL;

const PHASES = {
  planning:{label:"企画中",color:"var(--planning)",raw:"#f59e0b"},
  shootprep:{label:"撮影準備中",color:"var(--shootprep)",raw:"#ef4444"},
  editing:{label:"編集中",color:"var(--editing)",raw:"#3b82f6"},
  done:{label:"完了",color:"var(--done)",raw:"#10b981"}
};
const PHASE_ORDER=["planning","shootprep","editing","done"];
const MILESTONES=[
  {key:"企画初稿",short:"企画初稿",bucket:"planning",wr:"企画初稿"},
  {key:"企画決定",short:"企画決定",bucket:"planning",wr:"企画決定"},
  {key:"撮影",short:"撮影日",bucket:"shootprep",contains:"撮影",wr:"撮影日"},
  {key:"データ送付",short:"データ送付",bucket:"editing",wr:"データ送付"},
  {key:"デザイナー発注",short:"デザ発注",bucket:"editing",wr:"デザイナー発注"},
  {key:"デザイナー納品",short:"デザ納品",bucket:"editing",wr:"デザイナー納品"},
  {key:"編集発注",short:"編集発注",bucket:"editing",wr:"編集発注"},
  {key:"初稿",short:"初稿",bucket:"editing",wr:"初稿"},
  {key:"修正指示",short:"修正指示",bucket:"editing",wr:"修正指示"},
  {key:"再稿",short:"再稿",bucket:"editing",wr:"再稿"},
  {key:"修正指示2",short:"修正指示",bucket:"editing",alt:["修正指示（2回目）","修正指示2","修正指示②"],wr:"修正指示（2回目）"},
  {key:"納品",short:"納品",bucket:"editing",wr:"納品"},
  {key:"アップロード",short:"アップロード",bucket:"done",wr:"アップロード"},
  {key:"ショートアップ完了",short:"ショートUP",bucket:"done",alt:["ショートUP","ショートアップ"],wr:"ショートUP"}
];
const UP_IDX=MILESTONES.findIndex(m=>m.key==="アップロード");
const SHORT_IDX=MILESTONES.findIndex(m=>m.key==="ショートアップ完了");
const today=new Date();today.setHours(0,0,0,0);
document.getElementById("today").textContent="本日 "+today.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});

function addDays(b,n){const d=new Date(b);d.setDate(d.getDate()+n);return d;}
function parseAnyDate(s,ref){
  if(!s)return null; s=String(s).trim(); if(!s)return null;
  let m=s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if(m){const d=new Date(+m[1],+m[2]-1,+m[3]);d.setHours(0,0,0,0);return d;}
  m=s.match(/^(\d{1,2})[\/月](\d{1,2})/);
  if(m){const mon=+m[1]-1,day=+m[2];const base=ref||today;const y=base.getFullYear();
    const cands=[new Date(y-1,mon,day),new Date(y,mon,day),new Date(y+1,mon,day)];
    cands.forEach(d=>d.setHours(0,0,0,0));
    cands.sort((a,b)=>Math.abs(a-base)-Math.abs(b-base));
    return cands[0];}
  return null;
}
function fmt(d){return d?(d.getMonth()+1)+"/"+d.getDate()+"("+"日月火水木金土"[d.getDay()]+")":"—";}
function shortDate(d){return d?(d.getMonth()+1)+"/"+d.getDate():"—";}
function daysBetween(a,b){return Math.round((a-b)/86400000);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function completedIndex(v){
  v=(v||"").trim(); if(!v||v==="なし"||v==="未着手"||v==="ー"||v==="-")return -1;
  for(let i=0;i<MILESTONES.length;i++){const m=MILESTONES[i];
    if(v===m.key||v===m.short)return i;
    if(m.alt&&m.alt.indexOf(v)>=0)return i;}
  for(let i=0;i<MILESTONES.length;i++){if(v.indexOf(MILESTONES[i].key)>=0||MILESTONES[i].key.indexOf(v)>=0)return i;}
  return -1;
}
function shootInfo(s){
  const ref=parseAnyDate(s.dates["撮影"]||"",null)||today;
  const md=MILESTONES.map(m=>parseAnyDate(s.dates[m.key]||"",ref));
  const done=completedIndex(s.completed);
  const phase = done<0 ? "planning" : MILESTONES[done].bucket;
  const overdue=[]; for(let i=done+1;i<MILESTONES.length;i++){ if(md[i]&&md[i]<today)overdue.push(i); }
  const firstOverdue = overdue.length? overdue[0] : -1;
  return {md,done,phase,overdue,firstOverdue,delayed:overdue.length>0,shootD:parseAnyDate(s.dates["撮影"]||"",ref)};
}
function timelineHTML(info){
  const overdueSet=new Set(info.overdue);
  return MILESTONES.map((m,i)=>{
    let cls="future";
    if(i<=info.done)cls="done";
    else if(overdueSet.has(i))cls="overdue";
    else if(i===info.done+1)cls="current";
    const tip = API_URL ? m.short+"まで完了にする" : m.key;
    return `<div class="step ${cls}${API_URL?" clickable":""}" data-idx="${i}" title="${tip}"><span class="mk"></span>
      <div class="lbl">${m.short}</div><div class="dt">${shortDate(info.md[i])}</div></div>`;
  }).join("");
}
function countdownText(info){
  if(info.delayed){
    const i=info.firstOverdue; const dd=daysBetween(today,info.md[i]);
    return {late:true, html:`⚠ ${MILESTONES[i].short}<br>${dd}日 遅れ`};
  }
  if(info.done>=MILESTONES.length-1)return {late:false, html:"完了（UP済み）"};
  const nextIdx=info.done+1; const m=MILESTONES[nextIdx]; const d=info.md[nextIdx];
  if(!d)return {late:false, html:`次は「${m.short}」<br>日付未入力`};
  const dd=daysBetween(d,today);
  if(dd===0)return {late:false, html:`本日：${m.short}`};
  return {late:false, html:`${m.short}まで<br>あと${dd}日`};
}

let SHOOTS=[],activeFilter=null,sortMode="status";
let calY=today.getFullYear(), calM=today.getMonth();
let PUBEV=new Map();

/* ===== CSV（gviz）取得 ===== */
function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else{
      if(c==='"')q=true;
      else if(c===','){row.push(f);f="";}
      else if(c==='\n'){row.push(f);f="";rows.push(row);row=[];}
      else if(c!=='\r')f+=c;
    }}
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.map(r=>r.map(c=>String(c).trim()));
}
function gridToShoots(grid){
  if(!grid.length)return[];
  let hIdx=grid.findIndex(r=>r.some(c=>c.includes("テーマ"))||r.some(c=>c.trim()==="No."));
  if(hIdx<0)hIdx=0;
  const head=grid[hIdx].map(c=>c.trim());
  const find=(pred)=>{for(let i=0;i<head.length;i++){if(pred(head[i]))return i;}return -1;};
  const col={
    no:find(h=>h==="No."||h==="No"||h==="no"),
    theme:find(h=>h.includes("テーマ")),
    perf:find(h=>h==="演者"),
    place:find(h=>h==="場所"),
    time:find(h=>h==="時間"),
    len:find(h=>h.includes("尺")),
    note:find(h=>h==="備考"),
    completed:find(h=>h==="完了した工程"||h==="完了工程"||h==="現在の工程"||h.indexOf("完了した")>=0)
  };
  const usedCols=new Set();
  const findFree=(pred)=>{for(let i=0;i<head.length;i++){if(!usedCols.has(i)&&pred(head[i]))return i;}return -1;};
  const msCol=MILESTONES.map(m=>{
    let i=findFree(h=>h===m.key);
    if(i<0&&m.alt){for(const a of m.alt){i=findFree(h=>h===a);if(i>=0)break;}}
    if(i<0&&m.contains)i=findFree(h=>h.includes(m.contains));
    if(i>=0)usedCols.add(i);
    return i;
  });
  const g=(r,i)=>(i>=0&&r[i]!=null)?String(r[i]).trim():"";
  return grid.slice(hIdx+1).map((r,k0)=>{
    const dates={}; MILESTONES.forEach((m,k)=>{dates[m.key]=g(r,msCol[k]);});
    return {
      sheetRow:hIdx+k0+2,
      no:g(r,col.no),theme:g(r,col.theme),
      performers:g(r,col.perf).split("・").map(x=>x.trim()).filter(Boolean),
      place:g(r,col.place),time:g(r,col.time),len:g(r,col.len),note:g(r,col.note),
      completed:g(r,col.completed),dates
    };
  }).filter(s=>s.theme && s.theme!=="企画／テーマ");
}
async function load(){
  document.getElementById("grid").innerHTML='<div class="loading"><span class="spin"></span>スプレッドを読み込み中…</div>';
  try{
    const url=CSV_BASE+"?tqx=out%3Acsv&gid="+SHEET_GID+"&cachebust="+Date.now();
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const parsed=gridToShoots(parseCSV(await res.text()));
    if(!parsed.length)throw new Error("データが空です");
    SHOOTS=parsed; buildPubEvents(); renderSummary(); render(); renderCal();
  }catch(e){
    document.getElementById("grid").innerHTML=`<div class="errbox">データを読み込めませんでした。<br>
      <small>${esc((e&&e.message)||e)}</small><br>
      <small>スプレッドの共有設定が「リンクを知っている全員が閲覧可」になっているか確認してください。</small></div>`;
    document.getElementById("calGrid").innerHTML="";
    document.getElementById("calList").innerHTML='<div class="none">データを読み込めませんでした。</div>';
  }
}
document.getElementById("reload").onclick=()=>location.replace(location.pathname+"?r="+Date.now());

/* ===== 公開カレンダー ===== */
function dkey(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function buildPubEvents(){
  PUBEV=new Map();
  SHOOTS.forEach(s=>{
    const info=shootInfo(s);
    [[UP_IDX,"main"],[SHORT_IDX,"short"]].forEach(pair=>{
      const i=pair[0], type=pair[1];
      const d=info.md[i]; if(!d)return;
      const k=dkey(d);
      if(!PUBEV.has(k))PUBEV.set(k,[]);
      PUBEV.get(k).push({type,no:s.no,theme:s.theme,date:d,published:info.done>=i});
    });
  });
  PUBEV.forEach(list=>list.sort((a,b)=>(a.type===b.type?0:(a.type==="main"?-1:1))));
}
function renderCal(){
  const grid=document.getElementById("calGrid");
  document.getElementById("calYM").textContent=calY+"年"+(calM+1)+"月";
  const dow=["日","月","火","水","木","金","土"];
  let html=dow.map((n,i)=>`<div class="dow ${i===0?"sun":i===6?"sat":""}">${n}</div>`).join("");
  const first=new Date(calY,calM,1); first.setHours(0,0,0,0);
  const start=addDays(first,-first.getDay());
  const lastDay=new Date(calY,calM+1,0).getDate();
  const weeks=Math.ceil((first.getDay()+lastDay)/7);
  for(let c=0;c<weeks*7;c++){
    const d=addDays(start,c);
    const out=d.getMonth()!==calM;
    const isToday=d.getTime()===today.getTime();
    const wd=d.getDay();
    const evs=out?[]:(PUBEV.get(dkey(d))||[]);
    const pills=evs.map(e=>{
      const label=(e.type==="main"?"▶ ":"◆ ")+"No."+e.no+" "+e.theme;
      const tip=(e.type==="main"?"本編アップロード":"ショートUP")+"：No."+e.no+" "+e.theme+(e.published?"（公開済み）":"");
      return `<span class="pill ${e.type} ${e.published?"pub":""}" title="${esc(tip)}">${esc(label)}</span>`;
    }).join("");
    html+=`<div class="cell ${out?"out":""} ${isToday?"today":""} ${wd===0?"sun":wd===6?"sat":""}">
      <div class="dnum">${d.getDate()}</div>${pills}</div>`;
  }
  grid.innerHTML=html;
  renderCalList();
}
function renderCalList(){
  const box=document.getElementById("calList");
  const items=[];
  PUBEV.forEach(list=>list.forEach(e=>{
    if(e.date.getFullYear()===calY&&e.date.getMonth()===calM)items.push(e);
  }));
  items.sort((a,b)=>(a.date-b.date)||(a.type==="main"?-1:1));
  if(!items.length){
    box.innerHTML=`<h4>${calY}年${calM+1}月の公開予定</h4><div class="none">この月に公開予定はありません。</div>`;
    return;
  }
  const rows=items.map(e=>{
    const dd=daysBetween(e.date,today);
    let st="",cls="st";
    if(e.published){st="公開済み";cls="st pub";}
    else if(dd===0)st="本日";
    else if(dd>0)st="あと"+dd+"日";
    else st=(-dd)+"日超過";
    return `<tr><td class="dt">${fmt(e.date)}</td>
      <td><span class="tag ${e.type}">${e.type==="main"?"本編":"ショート"}</span></td>
      <td>No.${esc(e.no)}</td><td>${esc(e.theme)}</td>
      <td class="${cls}">${st}</td></tr>`;
  }).join("");
  box.innerHTML=`<h4>${calY}年${calM+1}月の公開予定（${items.length}件）</h4>
    <table><thead><tr><th>日付</th><th>種別</th><th>No.</th><th>企画／テーマ</th><th>状態</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}
function shiftMonth(n){const d=new Date(calY,calM+n,1);calY=d.getFullYear();calM=d.getMonth();renderCal();}
document.getElementById("calPrev").onclick=()=>shiftMonth(-1);
document.getElementById("calNext").onclick=()=>shiftMonth(1);
document.getElementById("calToday").onclick=()=>{calY=today.getFullYear();calM=today.getMonth();renderCal();};

function setView(v){
  document.getElementById("viewBoard").hidden=(v!=="board");
  document.getElementById("viewCal").hidden=(v!=="cal");
  document.querySelectorAll("#viewTabs button").forEach(b=>b.classList.toggle("on",b.dataset.view===v));
  if(v==="cal")renderCal();
  try{localStorage.setItem("kaeka-shoot-view",v);}catch(e){}
}
document.querySelectorAll("#viewTabs button").forEach(b=>b.onclick=()=>setView(b.dataset.view));

function renderSummary(){
  const c={planning:0,shootprep:0,editing:0,done:0}; let late=0;
  SHOOTS.forEach(s=>{const i=shootInfo(s);c[i.phase]++;if(i.delayed)late++;});
  const box=document.getElementById("summary");
  let html=`<div class="chip warn ${activeFilter==='delayed'?'active':''}" data-phase="delayed">⚠ 遅れ<span class="n">${late}</span></div>`;
  html+=PHASE_ORDER.map(k=>{const P=PHASES[k];
    return `<div class="chip ${activeFilter===k?"active":""}" data-phase="${k}">
      <span class="dot" style="background:${P.color}"></span>${P.label}<span class="n">${c[k]}</span></div>`;}).join("");
  box.innerHTML=html;
  box.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{const p=ch.dataset.phase;
    activeFilter=(activeFilter===p)?null:p;renderSummary();render();});
}
function cardHTML(r){const{s,info}=r;const P=PHASES[info.phase];
  const border=info.delayed?"var(--late)":P.raw;
  const cd=countdownText(info);
  return `<div class="card" data-row="${s.sheetRow}" data-no="${esc(s.no)}" data-theme="${esc(s.theme)}" style="border-left-color:${border}">
    <div class="c-left"><span class="status-badge" style="background:${P.color}">${P.label}</span>
      ${info.delayed?'<span class="delay-badge">遅れ</span>':''}
      <div class="no">No.${esc(s.no)}</div><div class="date">${fmt(info.shootD)}</div><div class="time">${esc(s.time||"")}</div></div>
    <div class="c-main"><h3>${esc(s.theme)}</h3>
      <div class="meta"><b>場所</b> ${esc(s.place||"—")}${s.performers.length?` ／ <b>演者</b> ${esc(s.performers.join("・"))}`:""}${s.len?` ／ <b>尺</b> ${esc(s.len)}`:""}</div>
      ${s.note?`<div class="note">📌 ${esc(s.note)}</div>`:""}</div>
    <div class="c-timeline">${timelineHTML(info)}</div>
    <div class="c-cd"><div class="countdown ${cd.late?'late':''}">${cd.html}</div></div></div>`;
}
function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const grid=document.getElementById("grid");
  let rows=SHOOTS.map(s=>({s,info:shootInfo(s)}));
  let view=rows.filter(r=>{
    if(activeFilter==="delayed"){ if(!r.info.delayed)return false; }
    else if(activeFilter&&r.info.phase!==activeFilter)return false;
    if(q){const hay=(r.s.theme+" "+r.s.place+" "+r.s.note+" "+r.s.performers.join(" ")).toLowerCase();if(!hay.includes(q))return false;}
    return true;});
  document.getElementById("count").textContent=view.length+" 件表示";
  if(!view.length){grid.innerHTML=`<div class="empty">条件に合う撮影がありません。</div>`;return;}
  if(sortMode==="date"){
    view.sort((a,b)=>(a.info.shootD||0)-(b.info.shootD||0));
    grid.innerHTML=view.map(cardHTML).join("");
  }else{
    view.sort((a,b)=>{const ra=PHASE_ORDER.indexOf(a.info.phase),rb=PHASE_ORDER.indexOf(b.info.phase);
      if(ra!==rb)return ra-rb;
      if(a.info.phase==="editing"){const na=parseInt(a.s.no,10),nb=parseInt(b.s.no,10);const va=isNaN(na)?99999:na,vb=isNaN(nb)?99999:nb;if(va!==vb)return va-vb;}
      return (a.info.shootD||0)-(b.info.shootD||0);});
    let html="",last=null;
    view.forEach(r=>{if(r.info.phase!==last){const P=PHASES[r.info.phase];const cnt=view.filter(x=>x.info.phase===r.info.phase).length;
      html+=`<div class="group-h"><span class="dot" style="background:${P.color}"></span>${P.label}<span class="gn">${cnt}件</span></div>`;last=r.info.phase;}
      html+=cardHTML(r);});
    grid.innerHTML=html;
  }
}
document.getElementById("q").oninput=render;
document.querySelectorAll("#sortSeg button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#sortSeg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");sortMode=b.dataset.sort;render();});

/* ===== 画面下の通知 ===== */
let toastT=null;
function toast(msg,isErr){
  let el=document.querySelector(".toast");
  if(!el){el=document.createElement("div");el.className="toast";document.body.appendChild(el);}
  el.textContent=msg;
  el.className="toast show"+(isErr?" err":"");
  clearTimeout(toastT);
  toastT=setTimeout(function(){el.className="toast"+(isErr?" err":"");},isErr?6000:2600);
}

/* ===== 工程の丸をクリック → その工程まで完了にしてスプレッドへ書き戻す ===== */
let writing=false;
document.getElementById("grid").addEventListener("click",async function(ev){
  if(!API_URL||writing)return;
  const step=ev.target.closest(".step.clickable"); if(!step)return;
  const card=step.closest(".card"); if(!card)return;
  const idx=parseInt(step.dataset.idx,10);
  const row=parseInt(card.dataset.row,10);
  const no=card.dataset.no, theme=card.dataset.theme;
  const s=SHOOTS.find(function(x){return x.sheetRow===row;});
  if(!s){toast("対象の行が見つかりません。「最新に更新」してからやり直してください",true);return;}
  const prev=s.completed, stage=MILESTONES[idx].wr;
  writing=true; step.classList.add("saving");
  s.completed=MILESTONES[idx].key;
  buildPubEvents(); renderSummary(); render(); renderCal();
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({row:row,no:no,theme:theme,stage:stage})});
    const out=await res.json();
    if(!out.ok)throw new Error(out.error||"書き戻しに失敗しました");
    toast("No."+no+" を「"+MILESTONES[idx].short+"」まで完了にしました");
  }catch(err){
    s.completed=prev;
    buildPubEvents(); renderSummary(); render(); renderCal();
    toast("スプレッドに書き戻せませんでした："+((err&&err.message)||err),true);
  }finally{ writing=false; }
});

/* ===== 自動更新：他の人がスプレッドを直した分を取り込む ===== */
setInterval(function(){
  if(document.visibilityState!=="visible"||writing)return;
  load();
},AUTO_REFRESH_MS);
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&!writing)load();
});

try{const v=localStorage.getItem("kaeka-shoot-view");if(v==="cal")setView("cal");}catch(e){}
load();
</script>
